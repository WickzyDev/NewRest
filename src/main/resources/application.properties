# ===============================
# Spring Boot Application Settings
# ===============================
spring.application.name=resturantapp

# Port — Railway provides $PORT at runtime
server.port=${PORT:8080}

# ===============================
# H2 Database Configuration (Local)
# ===============================
spring.datasource.url=jdbc:h2:mem:restaurant_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

